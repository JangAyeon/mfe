name: deploy-marketing # 워크플로우 이름

on:
  push:
    branches:
      - master # 또는 main
    paths:
      - packages/marketing/** # container 폴더 내 파일 변경 시에만 실행

defaults:
  run:
    working-directory: packages/marketing # 모든 커맨드는 이 폴더 내에서 실행됨

jobs:
  build:
    runs-on: ubuntu-latest # 우분투 VM에서 실행
    steps:
      - uses: actions/checkout@v2 # 리포지토리 코드 체크아웃

      - run: npm install # 의존성 설치
      - run: npm run build # 빌드 실행 (dist 디렉토리 생성됨)

      # AWS CLI 설치 액션
      - uses: shinyinc/action-aws-cli@v1.2

      # AWS S3에 dist 폴더 업로드
      - run: aws s3 sync dist s3://${{ secrets.AWS_S3_BUCKET_NAME }}/marketing/latest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
      - run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_DISTRIBUTION_ID }} --paths "/marketing/latest/remoteEntry.js"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
